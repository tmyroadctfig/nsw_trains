name: Release

on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only; creating a release needs write access to contents
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
